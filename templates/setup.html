{% extends "base.html" %}
{% block title %}Set up — aQui con fe Studio{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="kicker">aQui con fe Studio</p>
  <h1>Choose your password</h1>
  <p class="muted">This is the only gate to your studio. Make it strong and unique.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Password
      <input type="password" name="password" autocomplete="new-password" required />
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" required />
    </label>
    <div class="form-actions">
      <button type="submit" class="btn">Enter the studio</button>
    </div>
  </form>
</section>
{% endblock %}
