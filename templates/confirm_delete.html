{% extends "base.html" %}
{% block title %}Confirm deletion — aQui con fe Studio{% endblock %}
{% block content %}
<section class="card" style="max-width: 560px; margin: 3em auto;">
  <p class="kicker">Are you sure?</p>
  <h1>Delete {{ item_label }}?</h1>
  <p class="muted">This cannot be undone.</p>
  <form method="post">
    <div class="form-actions">
      <button type="submit" class="btn danger">Delete</button>
      <a href="{{ cancel_url }}" class="btn ghost">Keep it</a>
    </div>
  </form>
</section>
{% endblock %}
